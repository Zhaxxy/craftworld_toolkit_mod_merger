
name: Build and Release EXE

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile --noconsole --add-data "icon.ico;." --icon="icon.ico" --name craftworld_toolkit_mod_merger gui.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${GITHUB_RUN_NUMBER}" dist/craftworld_toolkit_mod_merger.exe \
            --title "craftworld_toolkit_mod_merger v${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --target "${GITHUB_SHA}"
